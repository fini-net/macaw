[advisories]
ignore = [
    "RUSTSEC-2023-0071",  # rsa: Marvin Attack timing sidechannel
]

# Documentation of why this is safe to ignore:
#
# The rsa crate vulnerability (RUSTSEC-2023-0071) is a timing sidechannel
# attack (Marvin Attack) that could potentially allow key recovery in TLS
# contexts using PKCS#1 v1.5 RSA decryption.
#
# This vulnerability is NOT exploitable in macaw because:
# 1. The rsa crate is only pulled in via sqlx-mysql (transitive dependency)
# 2. macaw exclusively uses SQLite - never MySQL
# 3. The vulnerable code path is in MySQL's TLS implementation
# 4. No MySQL connections are ever established by macaw
#
# Dependency chain: rsa ← sqlx-mysql ← sqlx ← sea-orm ← macaw
#
# Risk assessment: NONE - The vulnerable code is never executed.
#
# Future action: Review this ignore when upgrading sea-orm or sqlx.
# If upstream fixes become available, remove this ignore.
