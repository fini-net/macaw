[package]
name = "macaw"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/fini-net/macaw"
homepage = "https://github.com/fini-net/macaw"
license = "GPL-2.0-only"
description = "Domain registration backend integrating with OpenSRS API"

[dependencies]
thiserror = "2.0"
ureq = { version = "3.0", features = ["json", "native-tls"] }
quick-xml = { version = "0.41", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
md-5 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"

[dev-dependencies]
serial_test = "3.2"

[lib]
name = "macaw"
path = "src/lib.rs"

[[bin]]
name = "macaw"
path = "src/main.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
