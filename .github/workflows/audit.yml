---
name: Cargo audit

on:
  schedule:
    # weekly, Tuesdays at 7:30 UTC (offset from the 7:20 scorecards run)
    - cron: '30 7 * * 2'
  workflow_dispatch:
  push:
    branches:
      - main

# global permissions
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        id: audit
        env:
          NO_COLOR: '1'
        run: |
          set -o pipefail
          if cargo audit 2>&1 | tee audit-output.txt; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update tracking issue
        if: steps.audit.outputs.result == 'fail'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[cargo audit] RustSec advisories found in Cargo.lock'
        run: |
          BODY_FILE=$(mktemp)
          {
            echo "The scheduled \`cargo audit\` run found advisories against the current \`Cargo.lock\`."
            echo ""
            echo "<details>"
            echo "<summary>audit output</summary>"
            echo ""
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' audit-output.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "This issue is auto-generated by \`.github/workflows/audit.yml\`. It closes automatically once \`cargo audit\` passes again (usually after renovate's lockfile maintenance lands)."
          } > "$BODY_FILE"
          ISSUE=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == env.TITLE) | .number" | head -1)
          if [[ -n "$ISSUE" ]]; then
            echo "Updating existing tracking issue #$ISSUE"
            gh issue comment "$ISSUE" --body-file "$BODY_FILE"
          else
            echo "Creating new tracking issue"
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label bug
          fi

      - name: Close tracking issue on a clean audit
        if: steps.audit.outputs.result == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[cargo audit] RustSec advisories found in Cargo.lock'
        run: |
          ISSUE=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == env.TITLE) | .number" | head -1)
          if [[ -n "$ISSUE" ]]; then
            echo "Closing tracking issue #$ISSUE"
            gh issue close "$ISSUE" --comment 'cargo audit passes again — closing this tracking issue.'
          fi

      - name: Fail the run if advisories were found
        if: steps.audit.outputs.result == 'fail'
        run: |
          echo "cargo audit found advisories; a tracking issue has been filed. See the steps above."
          exit 1